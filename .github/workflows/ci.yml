name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only. WebKit on Linux needs `npx playwright install-deps`,
      # and the Firefox browser suites stay local with the Firefox package.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:layout
      - run: npm run test:scroll
      - run: npm run test:startup
